name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.4.0)'
        required: true
        type: string

# Only needs to create the release and upload assets; no package registry use.
permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="${VERSION_INPUT}"
          fi
          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version '${version}' (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.23
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cccl"]'

      # Build for every supported architecture so the artifact runs from V100
      # (sm_70) through H100 (sm_90), matching the README support matrix.
      - name: Configure CMake (all supported architectures)
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES="70;75;80;86;89;90"

      - name: Build library
        run: cmake --build build -j"$(nproc)"

      - name: Run host-side tests
        # GPU numerical tests skip on this GPU-less runner (they run in the GPU
        # workflow); this gate covers the build and the host smoke tests.
        run: ctest --test-dir build --output-on-failure

      # Install into a staging prefix so the artifact carries the library, the
      # public headers, and the CMake package config a downstream consumer needs.
      - name: Stage install tree
        run: cmake --install build --prefix staging/cuflash

      - name: Package release artifact
        run: |
          version="${{ steps.version.outputs.version }}"
          asset="cuflash-attn-${version}-linux-x86_64.tar.gz"
          tar -C staging -czf "${asset}" cuflash
          sha256sum "${asset}" > "${asset}.sha256"
          echo "asset=${asset}" >> "$GITHUB_ENV"

      - name: Generate changelog (since previous tag)
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prev_tag="$(git tag --list 'v*' --sort=-v:refname | grep -vx "${VERSION}" | head -n1 || true)"
          if [[ -n "${prev_tag}" ]]; then
            range="${prev_tag}..HEAD"
          else
            range="HEAD"
          fi
          {
            echo "changes<<EOF"
            git log --no-merges --pretty=format:'- %s (%h)' "${range}"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## cuflash ${{ steps.version.outputs.version }}

            ### Changes | 变更
            ${{ steps.changelog.outputs.changes }}

            ### Install | 安装
            The attached archive contains the shared library, public headers,
            and the CMake package config. Verify its integrity first:
            ```bash
            sha256sum -c ${{ env.asset }}.sha256
            ```
            Or build from source:
            ```bash
            cmake --preset release && cmake --build --preset release
            ```
          files: |
            ${{ env.asset }}
            ${{ env.asset }}.sha256
          draft: false
          prerelease: false
