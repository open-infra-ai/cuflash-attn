name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "README*.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/copilot-instructions.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "README*.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/copilot-instructions.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check C/C++/CUDA formatting
        uses: jidicula/clang-format-action@v4.15.0
        with:
          clang-format-version: '17'
          check-path: '.'
          exclude-regex: '(^|/)(build|third_party|external|vendor|\.git)(/|$)'
          fallback-style: 'Google'

  clang-tidy:
    name: Static Analysis (clang-tidy, host sources)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.23
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cccl"]'

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Configure (generate compile database)
        run: >
          cmake -B build
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_CUDA_ARCHITECTURES="80"
          -DBUILD_TESTS=ON

      - name: Run clang-tidy
        run: ./scripts/run_clang_tidy.sh build

  docs-build:
    name: Docs Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build docs
        working-directory: docs
        run: npm run docs:build

  # Build matrix. GitHub-hosted runners have no GPU, so the numerical GPU
  # tests report SKIPPED here (see tests/test_main.cpp) rather than running;
  # the value of this matrix is compile verification across the architectures
  # and build configurations the README claims to support, plus running the
  # host-only smoke tests (api_smoke, package_smoke) under each config.
  # Numerical correctness and compute-sanitizer run on the GPU workflow.
  build-test:
    name: Build & Test (${{ matrix.name }})
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release, sm_80
            cache-key: release-sm80
            cuda-arch: "80"
            build-type: Release
            extra-cmake-args: ""
          - name: Release, all architectures
            cache-key: release-all-architectures
            cuda-arch: "70;75;80;86;89;90"
            build-type: Release
            extra-cmake-args: ""
          - name: Debug, ASan + UBSan
            cache-key: debug-sanitizers
            cuda-arch: "80"
            build-type: Debug
            extra-cmake-args: "-DENABLE_ASAN=ON -DENABLE_UBSAN=ON"
          - name: Release, RapidCheck properties
            cache-key: release-rapidcheck
            cuda-arch: "80"
            build-type: Release
            extra-cmake-args: "-DENABLE_RAPIDCHECK=ON"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.23
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cccl"]'

      - name: Enable ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.cache-key }}
          variant: ccache

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DCMAKE_CUDA_ARCHITECTURES="${{ matrix.cuda-arch }}"
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          ${{ matrix.extra-cmake-args }}

      - name: Build
        run: cmake --build build -j2

      - name: Run tests
        # GPU numerical tests skip on this GPU-less runner; host smoke tests run.
        # ASan leak detection is disabled because the CUDA driver stub can report
        # spurious leaks at exit.
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build --output-on-failure -j2
